# Managed by taskrail: `taskrail init --github-workflow` and `taskrail upgrade` rewrite this file.
name: taskrail

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's runs share a group, so a new push cancels its superseded run. Each push gets a
# group of its own: a group keeps one pending run and a newly queued one cancels it, even without
# cancel-in-progress, so a group keyed on the mainline's ref would drop runs when merges land fast.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - run: .taskrail/bin/taskrail validate
